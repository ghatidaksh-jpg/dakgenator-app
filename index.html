
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DakGenator - AI Prompt Generator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e15">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: #0b0c10;
    }
    /* Native App Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: #12141d;
      border-bottom: 1px solid #232736;
    }
    .app-title {
      color: #9d7bf5;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .install-btn {
      background: #7952f5;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    /* Embedded Exact Hugging Face Space */
    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #0b0c10;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="top-bar">
      <div class="app-title">
        <span>✨</span> DakGenator
      </div>
      <button id="installAppBtn" class="install-btn">Install App</button>
    </div>

    <!-- Direct embed of your DakGenator Space -->
    <iframe 
      id="spaceFrame"
      src="https://dakshghati-dakgenator.hf.space"
      allow="camera; microphone; clipboard-read; clipboard-write;"
      loading="eager">
    </iframe>
  </div>

  <script>
    // Register Service Worker for PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function(e) {
        console.log("SW registration failed", e);
      });
    }

    // In-app Chrome Install button handler
    let deferredPrompt;
    const installBtn = document.getElementById("installAppBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") {
          installBtn.style.display = "none";
        }
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DakGenator App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 22px;
      text-align: center;
      color: #222;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px 0;
      color: #444;
      font-size: 14px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background: #0070f3;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }
    button:disabled {
      background: #888;
      cursor: not-allowed;
    }
    #statusBox {
      margin-top: 16px;
      padding: 12px;
      background: #eef2f6;
      border-radius: 6px;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>DakGenator</h1>

    <label for="promptInput">Prompt / Edit Instruction:</label>
    <input type="text" id="promptInput" placeholder="Describe the change or style...">

    <label for="filePicker">Upload Image:</label>
    <input type="file" id="filePicker" accept="image/*">

    <button id="actionBtn" type="button">Generate</button>

    <div id="statusBox"></div>
  </div>

  <script>
    document.getElementById("actionBtn").addEventListener("click", async function() {
      var btn = document.getElementById("actionBtn");
      var status = document.getElementById("statusBox");
      var prompt = document.getElementById("promptInput").value;
      var file = document.getElementById("filePicker").files[0];

      if (!file) {
        alert("Please select an image first.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Processing...";
      status.style.display = "block";
      status.innerText = "Connecting to Hugging Face model...";

      try {
        var gradio = await import("https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js");
        var app = await gradio.Client.connect("dakshghati/DakGenator");
        status.innerText = "Running DakGenator...";

        var result = await app.predict("/predict", [file, prompt]);
        status.innerText = result.data ? (result.data[0] || JSON.stringify(result.data)) : "Finished!";
      } catch (err) {
        status.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate";
      }
    });
  </script>
</body>
</html>
